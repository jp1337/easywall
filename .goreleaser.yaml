version: 2

project_name: easywall

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: easywall-core
    main: ./cmd/easywall-core
    binary: easywall-core
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jp1337/easywall/internal/shared.CurrentVersion={{.Version}}

  - id: easywall-web
    main: ./cmd/easywall-web
    binary: easywall-web
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jp1337/easywall/internal/shared.CurrentVersion={{.Version}}

archives:
  - id: default
    name_template: "easywall_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - web/**
      - locales/**
      - config/*.toml
      - systemd/*.service
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore(deps)"
      - "^docs"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Security"
      regexp: "^security"
      order: 0
    - title: "Features"
      regexp: "^feat"
      order: 1
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 2
    - title: "Other"
      order: 999

dockers_v2:
  - dockerfile: Dockerfile
    # Docker Hub and Quay namespaces come from env vars set by release.yml
    # (DOCKERHUB_USERNAME, QUAY_NAMESPACE) so they can be changed without
    # touching this file. GHCR namespace is the GitHub org name and stable.
    images:
      - "ghcr.io/jp1337/easywall"
      - "docker.io/{{ .Env.DOCKERHUB_USERNAME }}/easywall"
      - "quay.io/{{ .Env.QUAY_NAMESPACE }}/easywall"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      VERSION: "{{ .Version }}"
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
      - web/
      - locales/
      - config/
      - docker/
