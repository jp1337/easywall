services:
  easywall:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/jp1337/easywall:${VERSION:-latest}
    container_name: easywall
    restart: unless-stopped

    environment:
      # The interface renders timestamps in the container's zone. Without this
      # the container is UTC, and an operator in another one reads every audit
      # entry offset by their own — which is what happened before shortTime
      # converted at all. Set it to yours.
      - TZ=${TZ:-UTC}

    # nftables acts on the host's network namespace, so easywall shares it and
    # needs NET_ADMIN to issue the netlink calls that reach host tables.
    #
    # NET_ADMIN, and nothing beyond it. SYS_MODULE used to be here as well, which
    # is the capability to load kernel modules — from a container that already
    # shares the host's network, that is root on the host by another name, and it
    # is not something a firewall's own compose file should hand out to save a
    # modprobe. The documented capability list never mentioned it either. If
    # nf_tables is not loaded on the host, load it there:
    #
    #   modprobe nf_tables
    #
    # A host running nftables at all already has it.
    network_mode: host
    cap_add:
      - NET_ADMIN
    security_opt:
      # supervisord drops from root to the easywall user for the web process,
      # which is a privilege drop and unaffected by this. Nothing here needs a
      # setuid binary, so refusing new privileges outright costs nothing. It read
      # `no-new-privileges:false` before — the Docker default written out as
      # though it were a requirement.
      - no-new-privileges:true

    volumes:
      # Persistent config — edit web.toml and easywall.toml here
      - ./config:/etc/easywall

      # Persistent state (rules.json, version cache)
      - easywall_data:/var/lib/easywall

      # Audit and application logs
      - easywall_logs:/var/log/easywall

    # The same check the image now carries, spelled the same way.
    #
    # This used to be its own thing: `test -S /run/easywall/core.sock` and a
    # fetch of /login. A socket that exists says a core bound it, not that the
    # kernel is holding any rules — which is the whole subject of 2.17 — and
    # /login is a page that renders whether or not the firewall behind it is
    # filtering. `easywall-core health` asks what the kernel actually has, and
    # /healthz asks the process that serves the interface; the Dockerfile's
    # HEALTHCHECK carries the argument for both.
    #
    # Repeated here rather than dropped, because compose overriding the image's
    # check is what an operator expects to be able to edit — and because the
    # interval keys below are this file's to set. What must not happen again is
    # the two disagreeing about what they *run*: for a year this file tested one
    # thing and the image tested nothing, and the difference was invisible until
    # somebody ran `docker run`. The address follows bind_addr in
    # config/web.toml — change one and change the other.
    healthcheck:
      test: ["CMD-SHELL", "easywall-core health --config /etc/easywall/easywall.toml && wget -q --no-check-certificate -O /dev/null https://127.0.0.1:12227/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 15s, matching the image: the entrypoint chowns a bind-mounted
      # /etc/easywall before supervisord starts anything, and a first-run
      # container generates its certificate after that. At 5s the first two
      # probes measured a container that had not finished starting.
      start_period: 15s

volumes:
  easywall_data:
  easywall_logs:
