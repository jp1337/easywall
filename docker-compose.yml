services:
  easywall:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/jp1337/easywall:${VERSION:-latest}
    container_name: easywall
    restart: unless-stopped

    environment:
      # The interface renders timestamps in the container's zone. Without this
      # the container is UTC, and an operator in another one reads every audit
      # entry offset by their own — which is what happened before shortTime
      # converted at all. Set it to yours.
      - TZ=${TZ:-UTC}

    # nftables acts on the host's network namespace, so easywall shares it and
    # needs NET_ADMIN to issue the netlink calls that reach host tables.
    #
    # NET_ADMIN, and nothing beyond it. SYS_MODULE used to be here as well, which
    # is the capability to load kernel modules — from a container that already
    # shares the host's network, that is root on the host by another name, and it
    # is not something a firewall's own compose file should hand out to save a
    # modprobe. The documented capability list never mentioned it either. If
    # nf_tables is not loaded on the host, load it there:
    #
    #   modprobe nf_tables
    #
    # A host running nftables at all already has it.
    #
    # No NET_BIND_SERVICE: tls.acme's port-80 listener needs it, and it is not
    # here on purpose. supervisord drops easywall-web to an unprivileged user
    # with a plain setuid, not systemd's AmbientCapabilities, so the container
    # having the capability would not be enough — the process would still lose
    # it at that switch. Making it enough needs either a setcap binary, which
    # no-new-privileges:true below refuses to honor at exec, or running
    # easywall-web as root, which is the split this whole file exists to avoid.
    # tls.acme is documented as unsupported on this path instead — see
    # docs/_docs/installation/docker.md.
    network_mode: host
    cap_add:
      - NET_ADMIN
    security_opt:
      # supervisord drops from root to the easywall user for the web process,
      # which is a privilege drop and unaffected by this. Nothing here needs a
      # setuid binary, so refusing new privileges outright costs nothing. It read
      # `no-new-privileges:false` before — the Docker default written out as
      # though it were a requirement.
      - no-new-privileges:true

    volumes:
      # Persistent config — edit web.toml and easywall.toml here
      - ./config:/etc/easywall

      # Persistent state (rules.json, version cache)
      - easywall_data:/var/lib/easywall

      # Audit and application logs
      - easywall_logs:/var/log/easywall

    # There is deliberately no `healthcheck:` here. Compose uses the image's
    # HEALTHCHECK when this file declares none, and the Dockerfile has one — the
    # command, the interval, the timeout, the retries and the 15s start period
    # all come from there and govern this path too.
    #
    # Do not add one back for symmetry. A block here would be the *only* thing
    # that can drift: the image's check and a copy in this file are two
    # definitions of one artefact, and this repository already knows where that
    # ends — release.yml refuses a second packaging definition because two
    # definitions of one artefact is how a package comes to contain no binaries.
    # Deleting the copy makes the drift impossible instead of guarded.
    #
    # And this is a refusal rather than a request: `make test` fails if a
    # `healthcheck:` block appears here, or if the Dockerfile's HEALTHCHECK goes
    # away — TestTheContainerHealthCheckHasOneDefinition in internal/shared. The
    # analogy to release.yml is only worth making if it is enforced the same way.
    #
    # Two exceptions, and they are what keeps that prohibition credible rather
    # than absolute:
    #
    #   - **You changed bind_addr.** The image's check asks 127.0.0.1:12227
    #     because a HEALTHCHECK is baked at build time and cannot read web.toml.
    #     Move the interface and the container reads `unhealthy` for ever, with
    #     nothing wrong with it. A `healthcheck:` here naming your port is the
    #     right answer, and it is the only definition either way.
    #   - **You build the image locally on podman.** `build:` above plus
    #     `podman compose up -d` produces an OCI image, and the OCI spec has no
    #     healthcheck field — so podman drops the check with one warning and
    #     exits 0, leaving a container checked by nothing. Build it with
    #     `podman build --format docker -t … .` first and let compose use that
    #     image, or accept that a locally built OCI image carries no check. This
    #     is in carried-forward.md; a comment is not a fix for it.
    #
    # This block existed *because* the image had no check, and for a year it was
    # the whole story: it tested `test -S /run/easywall/core.sock` and fetched
    # /login, while a plain `docker run` was checked by nothing at all. A socket
    # that exists says a core bound it, not that the kernel is holding any rules
    # — which is the whole subject of 2.17 — and /login renders whether or not
    # the firewall behind it is filtering. The Dockerfile's HEALTHCHECK carries
    # what replaced it and why one request is enough, including the address,
    # which follows bind_addr in config/web.toml.

volumes:
  easywall_data:
  easywall_logs:
