version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - bodyclose
    - revive
  settings:
    errcheck:
      exclude-functions:
        # defer Close() on file/network handles is idiomatic Go — errors are
        # irrelevant when the resource was already fully read/written.
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*net.UnixConn).CloseWrite
        - (*multipart.Writer).Close
        # Cleanup helpers in tests: os.Remove and json.Encode errors don't affect test correctness.
        - os.Remove
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        - G104  # Errors unhandled — test cleanup code; not safety-relevant
        - G115  # int→uint conversions safe for rate-limit and length values
        - G117  # SessionKey field in TOML config — TOML config files are always operator-managed (alert #46 dismissed)
        - G120  # MaxBytesReader applied globally in MaxBodySize middleware (server.go)
        - G301  # Directory permissions: test code uses 0755 for temp dirs; not a production issue
        - G302  # File permissions: socket (0660 group-read for easywall) and audit log (0640) are intentional (alerts #29, #30 dismissed)
        - G304  # File path from variable — expected for config/rules loading (all G304 alerts dismissed)
        - G306  # WriteFile permissions: test code uses 0644 for temp files; not a production issue
        - G706  # Log injection false-positive: IP from net.SplitHostPort, not raw user input (alert #34 dismissed)
    revive:
      rules:
        - name: exported
          disabled: true  # don't require godoc on every exported symbol yet
  exclusions:
    rules:
      - path: .*_test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
