linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gosec
    - bodyclose
    - revive

linters-settings:
  gosec:
    excludes:
      - G304  # file path from variable — expected for config/rules loading
      - G115  # int→uint conversions are safe for rate-limit and length values
  revive:
    rules:
      - name: exported
        disabled: true  # don't require godoc on every exported symbol yet

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
