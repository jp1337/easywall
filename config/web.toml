# easywall web configuration
# See documentation at https://jp1337.github.io/easywall/configuration

bind_addr   = "0.0.0.0:12227"
socket_path = "/run/easywall/core.sock"
ssl_dir     = "/etc/easywall/ssl"
data_dir    = "/var/lib/easywall"
language    = "en"

# ─── Demo mode ──────────────────────────────────────────────────────────────
# Set to true to run easywall-web against an in-memory mock instead of the
# Unix socket. No easywall-core daemon required, no root, no nftables. State
# resets on process restart. Used for the public demo deployment.
# See https://jp1337.github.io/easywall/installation/demo/ for details.
demo_mode = false

# ─── Update check ───────────────────────────────────────────────────────────
# The dashboard asks github.com once a day whether a newer release exists. It is
# the only outbound request easywall makes, and it never delays a page: the
# answer comes from a cache on disk. Set to false to remove it entirely.
update_check = true

# ─── Secret — CHANGE THIS before first use ──────────────────────────────────
# Generate with: openssl rand -hex 32
# Signs the session cookie. There is no csrf_key: CSRF protection is Go 1.25's
# net/http.CrossOriginProtection, which checks Origin and Sec-Fetch-Site rather
# than issuing tokens, so it needs no secret of its own.
session_key = "CHANGE_ME_32_BYTES_HEX_ENCODED_SESSION_SECRET_HERE_XXXXXXXX"

# ─── Credentials — set via first-run wizard or fill in manually ─────────────
username = ""
password = ""  # argon2id hash, set by the first-run wizard

[tls]
# Leave empty to use an auto-generated self-signed certificate in ssl_dir.
# For Let's Encrypt or custom certs, set paths here:
cert = ""
key  = ""
