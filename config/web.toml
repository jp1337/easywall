# easywall web configuration
# See documentation at https://easywall-project.org/configuration

bind_addr   = "0.0.0.0:12227"
socket_path = "/run/easywall/core.sock"
ssl_dir     = "/etc/easywall/ssl"
data_dir    = "/var/lib/easywall"
language    = "en"

# ─── Demo mode ──────────────────────────────────────────────────────────────
# Set to true to run easywall-web against an in-memory mock instead of the
# Unix socket. No easywall-core daemon required, no root, no nftables. State
# resets on process restart. Used for the public demo deployment.
# See https://easywall-project.org/installation/demo/ for details.
demo_mode = false

# ─── Update check ───────────────────────────────────────────────────────────
# The dashboard asks github.com once a day whether a newer release exists. It
# never delays a page: the answer comes from a cache on disk. Set to false to
# remove it entirely. This is one of the two requests easywall can make; the
# other is the installation count below, which is off unless you switch it on.
update_check = true

# ─── Counting installations ─────────────────────────────────────────────────
# Off unless switched on, and asked for during the first-run wizard rather than
# assumed. Once a day:
#
#   GET https://telemetry.wdkro.de/v1/count?id=<32 hex>&v=<version>
#
# A random identifier generated on this machine and the version — enough to tell
# whether a critical fix reached everyone, not enough to describe anyone. Your
# address is not recorded at the other end. The identifier lives in
# <data_dir>/telemetry.json and may be deleted. Also switchable under System.
#
# Left out of this file on purpose: absent means nobody has answered yet, which
# is a different state from "no" and the one the first-run wizard asks about. An
# answer written here — by the wizard, by the System page, or by hand — is a
# stored value and beats EASYWALL_WEB_TELEMETRY.
#
# telemetry = false

# ─── Secret ─────────────────────────────────────────────────────────────────
# Signs the session cookie, so anyone who knows it can forge one. Left as the
# placeholder below, easywall generates a key on first start and writes it here
# — the placeholder is published in this repository, and a firewall interface
# signing cookies with a published key can be signed into by anyone.
# To choose your own: openssl rand -hex 32
# Signs the session cookie. There is no csrf_key: CSRF protection is Go 1.25's
# net/http.CrossOriginProtection, which checks Origin and Sec-Fetch-Site rather
# than issuing tokens, so it needs no secret of its own.
session_key = "CHANGE_ME_32_BYTES_HEX_ENCODED_SESSION_SECRET_HERE_XXXXXXXX"

# ─── Credentials — set via first-run wizard or fill in manually ─────────────
username = ""
password = ""  # argon2id hash, set by the first-run wizard

# ─── Second factor ──────────────────────────────────────────────────────────
# Written by the interface under Password → Second factor. Leave both empty to
# sign in with a password alone.
#
# totp_secret is the base32 shared secret your authenticator app holds.
# recovery_codes holds the argon2id hashes of the eight one-time codes — never
# the codes themselves, which are shown once and cannot be read back.
#
# Locked out with the phone gone and the codes gone? Empty both lines here and
# restart easywall-web: the password alone signs you in again. That is the whole
# way back, and it is the same file the password lives in on purpose.
totp_secret    = ""
recovery_codes = []

[tls]
# Leave empty to use an auto-generated self-signed certificate in ssl_dir.
# For Let's Encrypt or custom certs, set paths here:
cert = ""
key  = ""
