<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <!-- Bottom-to-top: deep navy → mid blue → bright cyan -->
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#0f2d4a"/>
      <stop offset="48%"  stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Subtle outer glow on the flame edge -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Flame silhouette clip -->
    <clipPath id="fc">
      <path d="M48,8 C55,14 76,30 79,50 C82,64 77,76 68,82
               C62,86 56,88 48,88 C40,88 34,86 28,82
               C19,76 14,64 17,50 C20,30 41,14 48,8Z"/>
    </clipPath>
  </defs>

  <!-- Dark rounded background -->
  <rect width="96" height="96" rx="20" fill="#0d1117"/>

  <!-- Flame filled with brick pattern -->
  <g clip-path="url(#fc)">
    <!-- Gradient fill -->
    <rect x="0" y="0" width="96" height="96" fill="url(#g)"/>

    <!-- ── Horizontal mortar lines ───────────────────────── -->
    <rect x="0" y="30"   width="96" height="2.5" fill="#0d1117" opacity="0.6"/>
    <rect x="0" y="49.5" width="96" height="2.5" fill="#0d1117" opacity="0.6"/>
    <rect x="0" y="69"   width="96" height="2.5" fill="#0d1117" opacity="0.6"/>

    <!-- ── Vertical mortar: odd rows (8–30 and 52–69) ───── -->
    <!-- 3 bricks, dividers at x=35 and x=62 -->
    <rect x="35" y="8"  width="2" height="22" fill="#0d1117" opacity="0.6"/>
    <rect x="62" y="8"  width="2" height="22" fill="#0d1117" opacity="0.6"/>
    <rect x="35" y="52" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="62" y="52" width="2" height="17" fill="#0d1117" opacity="0.6"/>

    <!-- ── Vertical mortar: even rows (32.5–49.5 and 71.5–88), offset ─ -->
    <!-- 4 bricks, dividers at x=23, x=48, x=73 -->
    <rect x="23" y="32.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="48" y="32.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="73" y="32.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="23" y="71.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="48" y="71.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
    <rect x="73" y="71.5" width="2" height="17" fill="#0d1117" opacity="0.6"/>
  </g>

  <!-- Cyan glow outline around the flame -->
  <path d="M48,8 C55,14 76,30 79,50 C82,64 77,76 68,82
           C62,86 56,88 48,88 C40,88 34,86 28,82
           C19,76 14,64 17,50 C20,30 41,14 48,8Z"
        fill="none" stroke="#22d3ee" stroke-width="1.5"
        opacity="0.65" filter="url(#glow)"/>
</svg>
