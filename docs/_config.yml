title: easywall
description: Linux firewall management with a web interface — built for 2026.
# Apex custom domain, so there is no path prefix. Every internal link goes
# through relative_url, which reads this — the one exception was the logo
# below, which carried the prefix by hand.
baseurl: ""
url: "https://easywall-project.org"

author:
  name: jp1337
  url: https://github.com/jp1337

lang: en
timezone: Europe/Berlin

# Shown as the badge in the sidebar. Must match shared.CurrentVersion in
# internal/shared/version.go — TestDocsVersionMatchesRelease enforces that.
# It was hardcoded in the layout as "v2.4" and drifted a patch release behind.
version: "2.13.0"

tagline: "Your firewall. Your rules. No surprises."
logo: /assets/img/icon.svg

# jekyll-seo-tag reads og:image / twitter:image only from page.image (front
# matter), never from site.logo. A defaults block sets it once for every page,
# so each share link carries the real 1200x630 image instead of no image at a
# all. A page can still override it by declaring its own `image:`.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.png

# The support server. A permanent invite — checked against Discord's own invite
# API, which reports no expiry — so it can be printed in a README that outlives
# any one release. Set here once; the footer and the pages read it from the site
# config rather than repeating the code.
discord: https://discord.gg/3zJMvChvUA

# The public demo. Three values in one place because five files hardcoded the
# host and four of them were still naming the one before this a release after
# the move — see TestTheOldDemoHostIsNotPublished. _includes/demo-callout.html
# and both landing-page buttons read them from here; README.md cannot, because
# GitHub does not run Jekyll over it.
demo_url: https://demo.easywall-project.org
demo_user: demo
demo_password: demo

social:
  name: jp1337
  links:
    - https://github.com/jp1337/easywall
    - https://discord.gg/3zJMvChvUA

theme: null
layouts_dir: _layouts

permalink: pretty

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  docs:
    output: true
    permalink: /docs/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - _site
  - .jekyll-cache
  - vendor

# The sidebar. Two single links, then five groups — and the groups are not an
# arbitrary tidy-up: Rules and System are the same two sections, in the same
# order, that the application's own sidebar shows. An operator looking at Ports
# in easywall finds the page under the label it sits under in the product.
#
# It was one flat group of twenty-seven links, which needed a scroll on a
# 1000px-tall window to reach the last eight. A group renders as <details> and
# only the one holding the current page is open — that state is derived in the
# layout from page.url, so there is nothing here to keep in sync and nothing to
# store. TestEveryDocsPageIsInTheNav holds both directions: every page in the
# collection has an entry here, and every entry here has a page.
nav:
  - title: Home
    path: /
  - title: Overview
    path: /docs/

  - title: Installation
    group: true
    children:
      - title: Requirements
        path: /docs/installation/requirements/
      - title: Debian / Ubuntu
        path: /docs/installation/debian/
      - title: Docker
        path: /docs/installation/docker/
      - title: Manual (Source)
        path: /docs/installation/manual/
      - title: Demo Mode
        path: /docs/installation/demo/
      - title: First Run
        path: /docs/installation/first-run/
      - title: Behind a Reverse Proxy
        path: /docs/installation/reverse-proxy/

  - title: Rules
    group: true
    children:
      - title: Ports
        path: /docs/features/ports/
      - title: Blacklist & Whitelist
        path: /docs/features/blacklist/
      - title: Port Forwarding
        path: /docs/features/forwarding/
      - title: Custom Rules
        path: /docs/features/custom-rules/
      - title: Firewall Filters
        path: /docs/features/filters/
      - title: Docker Coexistence
        path: /docs/features/docker/

  - title: System
    group: true
    children:
      - title: Dashboard
        path: /docs/features/dashboard/
      - title: Applying Rules
        path: /docs/features/apply/
      - title: System & Network Settings
        path: /docs/features/system-settings/
      - title: Second Factor
        path: /docs/features/two-factor/
      - title: Audit Log
        path: /docs/features/audit-log/
      - title: Export & Import
        path: /docs/features/export-import/
      - title: Recovery & Panic Mode
        path: /docs/features/recovery/

  - title: How it works
    group: true
    children:
      - title: Architecture
        path: /docs/architecture/
      - title: Configuration
        path: /docs/configuration/
      - title: Environment Variables
        path: /docs/environment/
      - title: Security
        path: /docs/security/

  - title: Project
    group: true
    children:
      - title: Roadmap
        path: /docs/roadmap/
      - title: Contributing
        path: /docs/contributing/
      - title: Changelog
        path: /docs/changelog/
      - title: License
        path: /docs/license/
