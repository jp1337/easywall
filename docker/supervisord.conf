[supervisord]
nodaemon=true
logfile=/var/log/easywall/supervisord.log
pidfile=/run/easywall/supervisord.pid

# supervisorctl could not run in this image at all until these two sections
# existed: `supervisorctl stop easywall-web` answered ".ini file does not
# include supervisorctl section" and exited 2. Without a control socket
# supervisord has no channel to talk to, so every documented way of stopping one
# of the two processes — the one an operator reaches for when the interface is
# down and the firewall must stay up, and the one this release's own acceptance
# uses to prove the HEALTHCHECK notices a dead web process — did nothing but
# print an error.
#
# Unix socket and not [inet_http_server]: an HTTP port would be reachable from
# the host, and this container shares the host's network. chmod 0700 with
# supervisord's own root ownership is the point of putting it here — /run/easywall
# is root:easywall 0750, so the web user can traverse the directory to reach
# core.sock and cannot open this. It must stay that way: control of supervisord
# is the power to stop easywall-core, and a network-facing process able to switch
# the firewall off would defeat the two-process split as thoroughly as writing
# easywall.toml would.
[unix_http_server]
file=/run/easywall/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/easywall/supervisor.sock

# supervisord's own RPC surface, which [supervisorctl] is a client of. Listed
# explicitly because supervisord only loads it when it is named: with the socket
# above and no rpcinterface section, supervisorctl connects and every command
# fails on a missing method.
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:easywall-core]
command=/usr/sbin/easywall-core --config /etc/easywall/easywall.toml
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:easywall-web]
command=/usr/sbin/easywall-web --config /etc/easywall/web.toml
# Unprivileged, which is the whole point of the two-process split — and was not
# true in the container until this line existed. supervisord runs as root, so
# without it easywall-web inherited root inside a container that also holds
# NET_ADMIN and SYS_MODULE, while architecture.md's table said "runs as:
# unprivileged user". The Debian units have always had User=easywall; the image
# did not.
user=easywall
directory=/usr/share/easywall
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
