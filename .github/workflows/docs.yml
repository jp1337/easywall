name: Docs

# The site was only ever built on the way out. This workflow ran on push to main
# and nowhere else, so a change that stops Jekyll building — a mistyped Liquid
# tag, an include that moved, front matter with a stray colon — was merged first
# and discovered afterwards, as a red deploy on main with the site already stale.
# The build now also runs on a pull request that touches docs/, without the
# permissions or the environment that deploying needs.
#
# .github/actions/** is in both lists because the search index moved into a
# composite action. For one commit it was not: the action held the only copy of
# the indexing command and of the assertion that the index covers every page,
# and a pull request editing it ran no job at all — while a push editing it did
# not redeploy, so the change reached main without ever reaching the site.
#
# CHANGELOG.md is in both lists for the same reason: check:changelog fails
# when it and the generated docs/_docs/changelog.md disagree, and a pull
# request that touches only CHANGELOG.md — exactly the drift that check
# exists to catch — would otherwise run no job at all.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/**"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/**"
      - "CHANGELOG.md"

# Read-only by default. Publishing rights are granted to the deploy job alone, so
# a pull-request run cannot reach GitHub Pages even in principle.
permissions:
  contents: read

jobs:
  # Does the site build at all? The one question a pull request could not answer.
  build:
    name: Site builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # codespell is a typo-only dictionary — near-zero false positives on
      # nftables, conntrack and argon2id, where hunspell floods. Configuration,
      # and the reasoning for every skip and every ignored word, is in
      # .codespellrc. First, because it needs no Ruby, no Node and no build.
      - name: Spelling
        run: pipx run codespell

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Two checks that need no Ruby and no built site: the generated
      # changelog page matches CHANGELOG.md, and the prose is inside the two
      # limits the docs-site-polish branch set. check:docs is not here — it
      # needs a built _site and a browser, and it runs after the build below.
      - name: The changelog page matches CHANGELOG.md
        run: npm run check:changelog

      - name: Prose stays inside its limits
        run: npm run check:prose

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: docs

      # Same command and the same JEKYLL_ENV as the deploy below, or this proves
      # something about a build nobody ships.
      - name: Build docs
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Jekyll exits 0 having written an empty site if every page were skipped,
      # so count what came out. Nine feature pages, the installation pages and the
      # landing page are the floor; a build that produces fewer has dropped
      # something without saying so.
      - name: The site is not empty
        working-directory: docs
        run: |
          set -euo pipefail
          pages=$(find _site -name '*.html' | wc -l)
          echo "$pages HTML pages built"
          test -f _site/index.html || { echo "::error::no landing page was built"; exit 1; }
          test -f _site/sitemap.xml || { echo "::error::no sitemap.xml was built; the sitemap plugin is broken"; exit 1; }
          [ "$pages" -ge 15 ] || {
            echo "::error::only $pages pages built; the site has more than that, so something was dropped"
            exit 1
          }

      # After the count above, not before it. Pagefind reports an empty site as
      # "Found 0 files matching docs/**/*.html" and exits 1, which is a true
      # statement about the index and tells nobody what went wrong; the check
      # above says `no landing page was built`. Still before the upload, which
      # is the part that matters — see
      # TestTheSearchIndexIsBuiltBeforeThePagesUpload.
      - uses: ./.github/actions/build-search-index

      # playwright-core ships no browser of its own — see test.yml's own
      # "Install Chromium" step for why --with-deps and not --only-shell.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The one check here that needs the built site and a real browser:
      # scripts/docs-check.mjs is Phase 1's only proof for a scroll handler, a
      # key binding, a result filter and a clipboard write — none of it visible
      # to a stylesheet diff or a Go test. Last, because it is the slowest step
      # in the job and everything above it fails faster.
      - name: The documentation site behaves as the browser sees it
        run: npm run check:docs

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: docs

      - name: Build docs
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # The same floor the pull-request build asserts. It was on that job alone,
      # which is the one path where nothing is published — so the check existed
      # everywhere except where it would have mattered. Jekyll exits 0 having
      # written an empty site if every page were skipped, and this job uploads
      # whatever _site holds.
      - name: The site is not empty
        working-directory: docs
        run: |
          set -euo pipefail
          pages=$(find _site -name '*.html' | wc -l)
          echo "$pages HTML pages built"
          test -f _site/index.html || { echo "::error::no landing page was built"; exit 1; }
          test -f _site/sitemap.xml || { echo "::error::no sitemap.xml was built; the sitemap plugin is broken"; exit 1; }
          [ "$pages" -ge 15 ] || {
            echo "::error::only $pages pages built; the site has more than that, so something was dropped"
            exit 1
          }

      # After the count above, not before it. Pagefind reports an empty site as
      # "Found 0 files matching docs/**/*.html" and exits 1, which is a true
      # statement about the index and tells nobody what went wrong; the check
      # above says `no landing page was built`. Still before the upload, which
      # is the part that matters — see
      # TestTheSearchIndexIsBuiltBeforeThePagesUpload.
      - uses: ./.github/actions/build-search-index

      # Not a repeat of the pull-request job's spelling and prose checks —
      # those are author-facing and a pull request already proved them, so
      # failing them again here would block a deploy for a typo and help
      # nobody. check:docs is different in kind: every one of its assertions
      # exists because that exact behaviour shipped broken once (see
      # scripts/docs-check.mjs). main carries no required status checks
      # (`enforce_admins` is on, but there is no `required_status_checks`), so
      # a push here is not guaranteed to have passed the pull-request job
      # first — the same reasoning "The site is not empty" and
      # build-search-index above are already duplicated in this job for.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: The documentation site behaves as the browser sees it
        run: npm run check:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
