name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  # ── Cross-compile both binaries for all target platforms ─────────────────
  build-binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Compile CSS
        run: npm run build:css

      - name: Download dependencies
        run: go mod download

      - name: Build easywall-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-core

      - name: Build easywall-web
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-web-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-web

      # -X writes to a variable and silently does nothing to a constant, which is
      # what CurrentVersion used to be. Ask the binary rather than trusting the
      # flag — only possible on the native architecture.
      - name: Check the version was compiled in
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          got=$(./bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} --version | awk '{print $2}')
          echo "easywall-core --version -> $got"
          [ "$got" = "dev" ] || {
            echo "::error::built with -X …CurrentVersion=dev but the binary reports $got"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  # ── Validate Docker image builds successfully (no push) ───────────────────
  build-docker:
    name: Docker Image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: VERSION=dev
          tags: easywall:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Validate Debian package can be built ─────────────────────────────────
  build-deb:
    name: Debian Package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Compile CSS
        run: npm run build:css

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y devscripts debhelper

      - name: Build .deb
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -us -uc -b -d

      - name: Collect .deb
        run: mkdir -p dist && mv ../*.deb dist/

      # Building the package proved it compiles. It never proved it installs —
      # and it did not: postinst left /etc/easywall unreadable by the user the
      # web service runs as, so a freshly installed package had no web
      # interface at all. That shipped because nothing here went past the build.
      - name: Install the package
        run: sudo apt-get install -y ./dist/*.deb

      - name: Check the installed layout
        run: |
          set -euo pipefail
          fail=0
          # Through sudo, because the layout being checked is the reason a plain
          # stat cannot do it: /etc/easywall is 0750 root:easywall and the runner
          # user is in neither. The check that reads the permissions has to be
          # allowed past them, or it reports "Permission denied" for the
          # arrangement working exactly as intended.
          check() { # path expected_owner expected_mode
            actual=$(sudo stat -c '%U:%G %a' "$1")
            if [ "$actual" != "$2 $3" ]; then
              echo "::error::$1 is '$actual', expected '$2 $3'"
              fail=1
            else
              echo "ok  $1  $actual"
            fi
          }
          # The two binaries first, because the package shipped without them for
          # its whole existence: they were built into debian/easywall and dh_prep
          # emptied that directory before the .deb was assembled. Every check
          # here is on an installed path, so a package that delivers no
          # executable says so by name rather than as a systemd exit code.
          check /usr/sbin/easywall-core  root:root         755
          check /usr/sbin/easywall-web   root:root         755
          check /etc/easywall            root:easywall     750
          check /etc/easywall/web.toml   easywall:easywall 600
          check /etc/easywall/easywall.toml root:root      600
          check /etc/easywall/ssl        easywall:easywall 750
          # Shared between the two processes: the root core writes rules.json,
          # the web user writes its caches. Owned by root with group write, so
          # the core does not need CAP_DAC_OVERRIDE to reach it.
          check /var/lib/easywall        root:easywall     770
          exit $fail

      # The package starts both services itself. Everything below asks the
      # installed system what it is doing rather than starting a second copy by
      # hand — which is what the previous version of this step did, so a core
      # daemon that never came up would not have been noticed.
      - name: Check both services are running
        run: |
          set -euo pipefail
          for unit in easywall-core easywall-web; do
            for i in $(seq 1 20); do
              systemctl is-active --quiet $unit && break
              sleep 0.5
            done
            systemctl is-active --quiet $unit || {
              echo "::error::$unit is not running"
              systemctl status $unit --no-pager -l || true
              journalctl -u $unit --no-pager -n 50 || true
              exit 1
            }
            echo "ok  $unit is active"
          done

      # The regression that made a fresh install useless: the unit reduces the
      # daemon's capabilities to CAP_NET_ADMIN, which also removes CAP_CHOWN, so
      # the socket stayed root:root and the web user was refused on connect.
      # Nothing in CI ever ran the core, so nothing caught it.
      - name: Check the web user can reach the core
        run: |
          set -euo pipefail
          # sudo for the same reason as the layout check: /run/easywall is 0750
          # root:easywall and the runner is in neither, which is the arrangement
          # being verified. Only the reading is privileged — the connection below
          # is made as the easywall user, which is the thing under test.
          sudo ls -l /run/easywall/core.sock
          owner=$(sudo stat -c '%U:%G' /run/easywall/core.sock)
          [ "$owner" = "root:easywall" ] || {
            echo "::error::the control socket is $owner, not root:easywall — easywall-web cannot connect"
            exit 1
          }
          sudo -u easywall python3 - <<'PY'
          import json, socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(5)
          try:
              s.connect("/run/easywall/core.sock")
          except OSError as e:
              print(f"::error::the web user cannot connect to the core socket: {e}")
              sys.exit(1)
          s.sendall(json.dumps({"type": "GET_RULES"}).encode())
          s.shutdown(socket.SHUT_WR)
          reply = json.loads(s.recv(65536))
          if not reply.get("success"):
              print(f"::error::the core refused a plain GET_RULES: {reply}")
              sys.exit(1)
          print("the core answered the web user:", str(reply)[:80])
          PY
          sudo test -s /var/lib/easywall/rules.json || {
            echo "::error::the core never wrote its rule store — it cannot reach /var/lib/easywall"
            exit 1
          }

      - name: Check the interface answers and the core config stays out of reach
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -sk -o /dev/null https://127.0.0.1:12227/firstrun && break
            sleep 0.5
          done
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:12227/firstrun)
          echo "GET /firstrun -> $code"
          [ "$code" = "200" ] || { echo "::error::the web interface did not come up"; exit 1; }
          # sudo again: ssl/ is 0750 easywall:easywall, so only the web user and
          # root can see the certificate it generates — which is the point of it.
          sudo test -s /etc/easywall/ssl/cert.pem || { echo "::error::no certificate was generated"; exit 1; }
          if sudo -u easywall sh -c 'echo x >> /etc/easywall/easywall.toml' 2>/dev/null; then
            echo "::error::the web user can write the core's configuration"
            exit 1
          fi
          echo "the core configuration is out of the web user's reach"

      # The version reaches the binary. It is written in with -ldflags -X, which
      # does nothing at all when the target is a constant — as it was, so every
      # released binary reported the literal in the source instead of its tag.
      - name: Check the version was compiled in
        run: |
          set -euo pipefail
          want=$(dpkg-parsechangelog --show-field Version)
          for bin in easywall-core easywall-web; do
            got=$(/usr/sbin/$bin --version | awk '{print $2}')
            echo "$bin --version -> $got (package $want)"
            [ "$got" = "$want" ] || {
              echo "::error::$bin reports $got but the package is $want — the -ldflags version injection is not landing"
              exit 1
            }
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb
          retention-days: 7
