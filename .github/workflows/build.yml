name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  # ── Cross-compile both binaries for all target platforms ─────────────────
  build-binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Compile CSS
        run: npm run build:css

      - name: Download dependencies
        run: go mod download

      - name: Build easywall-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-core

      - name: Build easywall-web
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-web-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-web

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  # ── Validate Docker image builds successfully (no push) ───────────────────
  build-docker:
    name: Docker Image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: VERSION=dev
          tags: easywall:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Validate Debian package can be built ─────────────────────────────────
  build-deb:
    name: Debian Package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Compile CSS
        run: npm run build:css

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y devscripts debhelper

      - name: Build .deb
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -us -uc -b -d

      - name: Collect .deb
        run: mkdir -p dist && mv ../*.deb dist/

      # Building the package proved it compiles. It never proved it installs —
      # and it did not: postinst left /etc/easywall unreadable by the user the
      # web service runs as, so a freshly installed package had no web
      # interface at all. That shipped because nothing here went past the build.
      - name: Install the package
        run: sudo apt-get install -y ./dist/*.deb

      - name: Check the installed layout
        run: |
          set -euo pipefail
          fail=0
          check() { # path expected_owner expected_mode
            actual=$(stat -c '%U:%G %a' "$1")
            if [ "$actual" != "$2 $3" ]; then
              echo "::error::$1 is '$actual', expected '$2 $3'"
              fail=1
            else
              echo "ok  $1  $actual"
            fi
          }
          check /etc/easywall            root:easywall     750
          check /etc/easywall/web.toml   easywall:easywall 600
          check /etc/easywall/easywall.toml root:root      600
          check /etc/easywall/ssl        easywall:easywall 750
          check /var/lib/easywall        easywall:easywall 750
          exit $fail

      - name: Check the web service starts and the core config stays out of reach
        run: |
          set -euo pipefail
          cd /usr/share/easywall
          sudo -u easywall /usr/sbin/easywall-web --config /etc/easywall/web.toml &
          for i in $(seq 1 20); do
            if curl -sk -o /dev/null https://127.0.0.1:12227/firstrun; then break; fi
            sleep 0.5
          done
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:12227/firstrun)
          echo "GET /firstrun -> $code"
          [ "$code" = "200" ] || { echo "::error::the web interface did not come up"; exit 1; }
          test -s /etc/easywall/ssl/cert.pem || { echo "::error::no certificate was generated"; exit 1; }
          if sudo -u easywall sh -c 'echo x >> /etc/easywall/easywall.toml' 2>/dev/null; then
            echo "::error::the web user can write the core's configuration"
            exit 1
          fi
          echo "the core configuration is out of the web user's reach"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb
          retention-days: 7
