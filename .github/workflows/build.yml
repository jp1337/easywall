name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: read

# A superseded run is finished work nobody reads. Renovate rebases its branches
# whenever main moves (rebaseWhen: behind-base-branch), and every push to a pull
# request used to leave its predecessor running to completion.
#
# Deliberately not on main: a cancelled run there could skip publishing an edge
# image or a deployment, and the point of a push to main is that it completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cross-compile both binaries for all target platforms ─────────────────
  build-binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # No npm: this job builds two Go binaries and uploads them. No asset is
      # embedded — templates, locales and stylesheets are read from disk at
      # runtime — so a stylesheet has no part in it. The one go:embed in the
      # tree is config/embed.go, which carries the two commented TOML defaults
      # that --write-config produces, and npm has nothing to do with those.
      - name: Download dependencies
        run: go mod download

      - name: Build easywall-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-core

      - name: Build easywall-web
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-web-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-web

      # -X writes to a variable and silently does nothing to a constant, which is
      # what CurrentVersion used to be. Ask the binary rather than trusting the
      # flag — only possible on the native architecture.
      - name: Check the version was compiled in
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          got=$(./bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} --version | awk '{print $2}')
          echo "easywall-core --version -> $got"
          [ "$got" = "dev" ] || {
            echo "::error::built with -X …CurrentVersion=dev but the binary reports $got"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  # ── Validate Docker image builds successfully (no push) ───────────────────
  build-docker:
    name: Docker Image
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # load, so the steps below can run what was just built. Without it
          # buildx keeps the result in its own cache and `docker run easywall:dev`
          # finds no such image — the build was all this job ever did.
          load: true
          platforms: linux/amd64
          build-args: VERSION=dev
          tags: easywall:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── The HEALTHCHECK, measured rather than read ────────────────────────
      #
      # This job built the image and stopped. That is how the container came to
      # ship for a year with no HEALTHCHECK in it at all while docker-compose.yml
      # had one, and how docker/entrypoint.sh's incident stayed invisible: the
      # web process exited 1, supervisord restarted it for ever, the check of the
      # day looked only at the core's socket, and the container stayed "Up".
      #
      # A grep over the Dockerfile would not have caught any of that. So this
      # runs the check, kills each half in turn, and reads the status Docker
      # itself computed. Three states, and the middle one is the recorded
      # incident.
      #
      # This covered docker-compose.yml too, by construction rather than by
      # coincidence, until 2.19: that file declared no `healthcheck:` block, so
      # compose inherited the image's — the one measured here was the only one
      # there was. Since 2.19, docker-compose.yml carries its own healthcheck:
      # block (podman's OCI format has no healthcheck field, so `podman build`
      # dropped it silently — see carried-forward.md). This step measures the
      # image's check; the next one, "compose, as documented", runs compose.
      #
      # Its own network namespace, not the host's. docker-compose.yml shares the
      # host's because nftables must reach host tables, and doing that here would
      # apply a firewall to the machine running the job — at policy drop, to the
      # network the job needs. The check under measurement does not care which
      # namespace the table is in.
      #
      # The seeded rules.json is not decoration either. A container that has
      # never applied anything is honestly `fail/not_enforcing` — RulesStore
      # starts empty and enforcing an empty set at policy drop would close SSH —
      # so `healthy` is not reachable until something has been applied, and the
      # first measurement would otherwise be measuring the wrong thing.
      - name: The HEALTHCHECK notices either half dying
        run: |
          set -euo pipefail

          state() { docker inspect -f '{{.State.Health.Status}}' easywall-hc 2>/dev/null || echo missing; }

          # Docker recomputes on its own interval (10s, retries 3), so a
          # transition takes up to ~40s. Polled rather than slept, and the
          # health log is printed on a timeout — "expected unhealthy, got
          # healthy" with nothing else is the one failure that costs an hour.
          expect() {
            want=$1; what=$2
            for _ in $(seq 1 30); do
              [ "$(state)" = "$want" ] && { echo "ok  $what: $want"; return 0; }
              sleep 3
            done
            echo "::error::$what: expected '$want', the container reads '$(state)'"
            docker inspect -f '{{json .State.Health}}' easywall-hc || true
            docker logs easywall-hc --tail 50 || true
            exit 1
          }

          docker run -d --name easywall-hc --cap-add NET_ADMIN easywall:dev
          docker exec -i easywall-hc sh -c 'cat > /var/lib/easywall/rules.json' <<'JSON'
          {"current":{"tcp":[{"port":"12227","description":"easywall web","ssh":false}],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]},
           "staged":{"tcp":[{"port":"12227","description":"easywall web","ssh":false}],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]},
           "backup":{"tcp":[],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]}}
          JSON
          docker restart easywall-hc
          expect healthy "a container with rules in the kernel and both processes up"

          # The recorded incident. If this reads healthy, the check is the old
          # defect in a new spelling: a live core with a dead interface.
          docker exec easywall-hc supervisorctl stop easywall-web
          expect unhealthy "the web process stopped"

          docker exec easywall-hc supervisorctl start easywall-web
          expect healthy "the web process back"

          # degraded must read healthy, and this is the measurement that keeps
          # it that way. handler_health.go answers 200 for degraded because
          # every cause of it is immune to a restart — a failed proof and a
          # build finding are the same binary, a dead stateful counter is the
          # same rules — so restarting buys nothing and costs a window in which
          # the machine is not filtering. A `failed` self-test stamp is the
          # cheapest degraded state to reach: `unprovable` is the container's
          # normal state and deliberately does not degrade.
          # Asserted in three parts, because `expect healthy` alone would pass
          # on a container that was healthy already and never prove the
          # degraded state was reached at all.
          docker exec -i easywall-hc sh -c 'cat > /var/lib/easywall/selftest.json' <<'JSON'
          {"version":"dev","kernel":"ci","result":"failed","at":"2026-01-01T00:00:00Z","detail":"written by the workflow to reach degraded"}
          JSON
          # `|| true` and a case, not a pipe into grep: `easywall-core health`
          # exits 1 on degraded, and under `set -o pipefail` a pipeline whose
          # left side exits non-zero fails however well grep matched — which
          # would report "not degraded" about a container that is.
          reported=$(docker exec easywall-hc easywall-core health --config /etc/easywall/easywall.toml || true)
          case "$reported" in
            *"health:     degraded"*) echo "ok  the seeded stamp produced a degraded state" ;;
            *) echo "::error::the seeded stamp did not produce a degraded state, so nothing below measures one: $reported"; exit 1 ;;
          esac
          # Read out of the image, never hand-copied. A second spelling of the
          # healthcheck command in the step that measures the healthcheck is the
          # same drift the compose block was deleted over, reappearing here —
          # and it would have mattered: with a composite `easywall-core health
          # && wget` restored to the Dockerfile, a copy of the plain wget here
          # would still exit 0 and the only assertion left to catch it would be
          # the probe loop below.
          # `|| true`, because an image with no HEALTHCHECK has a nil
          # .Config.Healthcheck and the template errors — under `set -e` that
          # would kill the step with a Go template message instead of the line
          # below, which is the one that says what actually went wrong.
          probe=$(docker inspect -f '{{index .Config.Healthcheck.Test 1}}' easywall-hc 2>/dev/null || true)
          [ -n "$probe" ] || { echo "::error::the image carries no HEALTHCHECK — a podman build on the default OCI format drops it silently, and there is nothing here to measure"; exit 1; }
          docker exec easywall-hc sh -c "$probe" \
            || { echo "::error::the image's own check refused a degraded firewall — a restart cannot fix any cause of degraded and costs a window with no filtering"; exit 1; }
          # Seven, not five. The status flips 37-40s after a failure starts
          # (three consecutive failures at a 10s interval, plus up to 10s to the
          # first one), and five iterations end ~43s in — five seconds of margin
          # on the one assertion that catches a restored composite check. Seven
          # is ~63s, comfortably past the flip that must not happen.
          for _ in 1 2 3 4 5 6 7; do
            [ "$(state)" = healthy ] || { echo "::error::a degraded firewall read '$(state)'"; exit 1; }
            sleep 10
          done
          echo "ok  a degraded firewall, over 7 probes: healthy"
          docker exec easywall-hc rm -f /var/lib/easywall/selftest.json

          # The other half, and the case Enforcing()'s own comment describes as
          # having shown green on the dashboard: the table is gone, so the
          # machine is not filtering, and /healthz answers 503.
          docker exec easywall-hc nft delete table inet easywall
          expect unhealthy "the nftables table deleted"

      # ── A 2.21 data directory, taken apart safely ─────────────────────────
      #
      # Until 2.22 /var/lib/easywall was 0770 and shared with the web user, who
      # could replace the core's files there and plant links root wrote through.
      # The entrypoint now makes it root's (0750) and the web's state its own
      # web/ (0700). A named volume or a bind mount from 2.21 still has the old
      # shape, so this hands the image one — a web file to keep, a link where
      # root writes, web/ itself a link to /etc, a panic marker, a FIFO, a core
      # file replaced outright and hard-linked under a web name — and asserts
      # each is dealt with, nothing is followed, and a second start finds
      # nothing to do. stat runs in the same container, after the entrypoint,
      # so it sees the /etc the link named.
      - name: The entrypoint takes a 2.21 data directory apart safely
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          d="${{ runner.temp }}/easywall-data-2.21"
          sudo rm -rf "$d"
          sudo install -d -o 0 -g 101 -m 0770 "$d"
          # The web's state, which must survive...
          printf '{"step":42}' | sudo tee "$d/totp_replay.json" >/dev/null
          # ...and what the old mode let the web user plant: a link where root
          # writes, web/ itself a link to /etc, a panic marker, a FIFO where
          # the core reads, and core files replaced outright — one of them
          # hard-linked under a web name, so it would stay writable from web/.
          sudo ln -s /etc/shadow "$d/last_apply"
          sudo ln -s /etc "$d/web"
          sudo touch "$d/panic" "$d/rules.json" "$d/usage.json"
          sudo mkfifo "$d/selftest.json"
          sudo ln "$d/usage.json" "$d/telemetry.json"
          sudo chown -h 100:101 "$d/totp_replay.json" "$d/last_apply" "$d/web" "$d/panic" \
            "$d/rules.json" "$d/usage.json" "$d/selftest.json"
          sudo chmod 0666 "$d/rules.json" "$d/usage.json"

          etc=$(docker run --rm -v "$d:/var/lib/easywall" easywall:dev stat -c '%u:%g %a' /etc)
          [ "$etc" = "0:0 755" ] || fail "the container's /etc is '$etc' after the entrypoint met web -> /etc: it followed the link"
          [ "$(sudo stat -c '%u:%g %a' "$d")" = "0:101 750" ] \
            || fail "the data directory is $(sudo stat -c '%u:%g %a' "$d"), want 0:101 750 — the web user can still write the core's files"
          # Owner, mode and link count: a chmod alone would leave the web
          # user's inode, which its owner can go on writing in place.
          [ "$(sudo stat -c '%u %a %h' "$d/rules.json")" = "0 600 1" ] \
            || fail "rules.json is '$(sudo stat -c '%u %a %h' "$d/rules.json")', want a root-owned copy: '0 600 1'"
          [ "$(sudo stat -c '%u %a %h' "$d/usage.json")" = "0 600 1" ] \
            || fail "usage.json is '$(sudo stat -c '%u %a %h' "$d/usage.json")', want '0 600 1': still the web user's inode"
          ! sudo test -p "$d/selftest.json" || fail "a FIFO the web user made survived"
          [ "$(sudo stat -c %i "$d/web/telemetry.json")" != "$(sudo stat -c %i "$d/usage.json")" ] \
            || fail "web/telemetry.json is still usage.json's inode"
          if ! sudo test -d "$d/web" || sudo test -L "$d/web"; then fail "web/ is not a real directory"; fi
          [ "$(sudo stat -c '%u:%g %a' "$d/web")" = "100:101 700" ] || fail "web/ is $(sudo stat -c '%u:%g %a' "$d/web"), want 100:101 700"
          ! sudo test -L "$d/last_apply" || fail "the planted last_apply link is still there"
          ! sudo test -e "$d/panic" || fail "a panic marker the web user made survived: the core would leave the firewall down"
          [ "$(sudo cat "$d/web/totp_replay.json")" = '{"step":42}' ] || fail "the TOTP replay step did not move into web/"
          echo "ok  a 2.21 data directory: made root's, web/ its own, the link removed and nothing followed"
          again=$(docker run --rm -v "$d:/var/lib/easywall" easywall:dev true 2>&1)
          case "$again" in *"/var/lib/easywall"*) fail "a second start still found something to repair: $again" ;; esac
          echo "ok  a second start changed nothing"
          sudo rm -rf "$d"

      # ── compose, as documented ────────────────────────────────────────────
      #
      # The step above measures the image under a plain `docker run`. Nothing
      # ran docker-compose.yml — the first command in the installation guide —
      # and every 2.22 finding lived there: B (the first visitor owned the
      # firewall), A (containers lost the network at the first apply), K (the
      # mount put the account into the git checkout), D (a bind-mounted
      # /var/lib/easywall the web user could not write, while healthy) and C
      # (the health check ignored bind_addr). One assertion each, every one
      # verified by breaking the code it covers.
      #
      # docker-compose.ci.yml changes three things and nothing else: the image
      # just built, a bridge network with a fixed address instead of the host's
      # (same reason as the step above), and empty bind mounts where compose has
      # named volumes. ./easywall-config is used exactly as documented.
      - name: compose, as documented
        env:
          EASYWALL_CI_STATE: ${{ runner.temp }}/easywall-compose
        run: |
          set -euo pipefail
          compose() { docker compose -f docker-compose.yml -f docker-compose.ci.yml "$@"; }
          fail() {
            echo "::error::$*"
            compose logs --no-log-prefix easywall 2>&1 | tail -40 || true
            exit 1
          }
          ip=172.30.99.10

          # The documented command, minus the build this job has already done.
          compose up -d --no-build --pull never

          # B — the token is in the log, and /firstrun refuses a claim without it.
          token=""
          for _ in $(seq 1 60); do
            token=$(compose logs --no-log-prefix easywall 2>/dev/null | grep 'setup token' | tail -1 | jq -r '.token // empty' || true)
            [ -n "$token" ] && break
            sleep 1
          done
          [ -n "$token" ] || fail "no 'setup token' line in docker compose logs: nobody can complete /firstrun"
          echo "ok  B: the log carries a setup token"

          for _ in $(seq 1 40); do curl -sk -m 5 -o /dev/null "https://$ip:12227/firstrun" && break; sleep 0.5; done
          form='username=ci&password=averysecurepass1!&password_confirm=averysecurepass1!&ssh_port=22'
          code=$(curl -sk -m 5 -o /dev/null -w '%{http_code}' --data "$form" "https://$ip:12227/firstrun")
          [ "$code" = 303 ] || fail "POST /firstrun without the token answered $code, want 303 back to the form"
          # The other half, or the refusal above could be any rejection at all.
          body=$(curl -sk -m 5 --data "$form" --data-urlencode "setup_token=$token" "https://$ip:12227/firstrun")
          case "$body" in
            *totp-secret*) echo "ok  B: /firstrun refuses a claim without the token and takes one with it" ;;
            *) fail "POST /firstrun with the logged token did not reach the TOTP step" ;;
          esac

          # A — the seeded easywall.toml trusts Docker's bridges. Captured, then
          # matched: piped into grep -q, compose exec died of SIGPIPE whenever the
          # section arrived in two frames, and pipefail blamed a correct file
          # (TestNoWorkflowPipesIntoAReaderThatStopsEarly).
          section=$(compose exec -T easywall sed -n '/^\[docker\]/,/^\[/p' /etc/easywall/easywall.toml)
          grep -Eq '^[[:space:]]*enabled[[:space:]]*=[[:space:]]*true' <<<"$section" \
            || fail "/etc/easywall/easywall.toml was not seeded with [docker] enabled = true: $section"
          echo "ok  A: [docker] enabled = true"

          # K — ./easywall-config was seeded from the image and stays out of git.
          for f in web.toml easywall.toml; do
            sudo test -s "easywall-config/$f" || fail "the entrypoint did not seed ./easywall-config/$f from the image's defaults"
          done
          git check-ignore -q easywall-config/web.toml || fail "./easywall-config is not gitignored — the account is one 'git add' away"
          dirty=$(sudo git -c safe.directory="$PWD" status --porcelain)
          [ -z "$dirty" ] || fail "the compose run left the checkout dirty — secrets would be one 'git add' away: $dirty"
          echo "ok  K: ./easywall-config seeded, and git sees nothing"

          # D — the pinned ids; the web user writes its own web/ and not the core's directory.
          ids=$(compose exec -T easywall id easywall)
          grep -q 'uid=100(easywall) gid=101(easywall)' <<<"$ids" \
            || fail "the easywall user is not uid 100 / gid 101: $ids"
          compose exec -T easywall su easywall -s /bin/sh -c 'test -w /var/lib/easywall/web' \
            || fail "the easywall user cannot write its state directory in a bind-mounted /var/lib/easywall"
          if compose exec -T easywall su easywall -s /bin/sh -c 'ln -s /etc/shadow /var/lib/easywall/last_apply' 2>/dev/null; then
            fail "the easywall user can plant a link in the core's /var/lib/easywall"
          fi
          echo "ok  D: uid 100, gid 101, web/ writable by the web user and the core's directory not"

          # C — the health check follows bind_addr. Moved onto the container's own
          # address and another port, which refuses 127.0.0.1 and is on no
          # health_allow, the container must still read healthy. That needs rules in
          # the kernel first — a container that never applied is honestly not
          # enforcing (see the HEALTHCHECK step above).
          compose exec -T easywall sh -c 'cat > /var/lib/easywall/rules.json' <<'JSON'
          {"current":{"tcp":[{"port":"12228","description":"easywall web","ssh":false}],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]},
           "staged":{"tcp":[{"port":"12228","description":"easywall web","ssh":false}],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]},
           "backup":{"tcp":[],"udp":[],"blocklist":[],"allowlist":[],"forwarding":[],"custom":[]}}
          JSON
          EASYWALL_CI_WEB_BIND="$ip:12228" compose up -d --no-build --pull never --force-recreate
          health=""
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' easywall 2>/dev/null || echo missing)
            [ "$health" = healthy ] && break
            sleep 3
          done
          [ "$health" = healthy ] || {
            docker inspect -f '{{json .State.Health}}' easywall || true
            fail "bind_addr moved to $ip:12228: the container reads '$health', want healthy"
          }
          echo "ok  C: healthy with bind_addr on $ip:12228"

      - name: Clean up
        if: always()
        env:
          EASYWALL_CI_STATE: ${{ runner.temp }}/easywall-compose
        run: |
          docker rm -f easywall-hc || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          sudo rm -rf easywall-config "$EASYWALL_CI_STATE"

  # ── Validate Debian package can be built, installed and started ──────────
  #
  # One leg per architecture, each on its own native runner — the same shape as
  # the image build in publish-edge.yml and for the same reason: a cross-built
  # package is a package nobody installs, and everything below this build step
  # installs it, starts both services and talks to the socket. arm64 runners are
  # free for public repositories, so the second leg costs nothing and runs in
  # parallel.
  #
  # No GOARCH anywhere: debian/control says `Architecture: any` and debian/rules
  # calls a plain `go build`, so the runner decides what comes out. That is also
  # what makes the file name right — dpkg names it from DEB_HOST_ARCH.
  #
  # This package is a firewall, and since 2.7 (the boot-restore release)
  # easywall-core programs nftables into the kernel the instant it starts —
  # "default drop until confirmed" begins at process start, not at the first
  # apply. This job used to install the .deb straight onto the runner that is
  # executing it, via `sudo apt-get install -y ./dist/*.deb`, and postinst
  # starts easywall-core.service unconditionally. That handed the runner its
  # own `input policy drop`. The job did not crash — it lost its route back to
  # the Actions service, so it froze at whatever step happened to be running
  # when the rule landed: install, a purely local check, the artifact upload —
  # a different step each run, because it depends on exactly when the runner's
  # own connection got cut, not on anything the job itself does wrong. With no
  # timeout on the job it then sat for roughly 47 minutes before the platform
  # gave up, against ~2 minutes for a green run.
  #
  # release.yml builds this exact same package and has never shown any of
  # this, for one reason: it only builds. It never installs what it builds, so
  # postinst never runs anywhere near the machine executing the job.
  #
  # The fix is not to install less — the coverage that matters is that the
  # package actually starts, because a previous release shipped one that
  # didn't and nothing here caught it. The fix is to give the install
  # somewhere to point nftables that isn't the runner's own network
  # namespace: a privileged container gets its own netns, so the rules land
  # there and the runner keeps its network throughout. The checks need
  # systemd for real, so ubuntu:24.04 (which ships none) installs systemd and
  # execs it as PID 1 before the package goes anywhere near apt. That last
  # part matters on its own: debian/postinst only starts the services
  # `if [ -d /run/systemd/system ]`, and that directory only exists once
  # systemd is actually running — so a container where systemd never came up
  # would "install" the package, start nothing, and every check below would
  # report nothing running and call it a pass. Systemd's readiness is
  # therefore asserted before the install, not inferred from it.
  build-deb:
    name: Debian Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # No npm here on purpose. web/static/style.css is a committed artefact and
      # the `assets` job already fails if it does not match its source, so
      # rebuilding it would recompile a file the tree is guaranteed to carry —
      # and it would make this job need @tailwindcss/oxide for arm64 for nothing.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y devscripts debhelper

      - name: Build .deb
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -us -uc -b -d

      - name: Collect .deb
        run: mkdir -p dist && mv ../*.deb dist/

      # The one mistake a file name cannot show: a package that says arm64 and
      # carries amd64 binaries. Ask the artefact for both. Pure inspection —
      # dpkg-deb and tar, nothing is installed — so this still runs on the
      # runner itself.
      - name: It is a package for this architecture
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          got=$(dpkg-deb --field "$deb" Architecture)
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "::error::$deb is Architecture=$got on a ${{ matrix.arch }} runner"
            exit 1
          }
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/sbin/easywall-core > /tmp/core
          kind=$(file /tmp/core)
          echo "$kind"
          case "${{ matrix.arch }}" in
            amd64) grep -q "x86-64" <<<"$kind" ;;
            arm64) grep -q "aarch64" <<<"$kind" ;;
          esac || {
            echo "::error::the binary inside the ${{ matrix.arch }} package is not ${{ matrix.arch }}"
            exit 1
          }
          echo "ok  $deb is $got and carries a $got binary"

      # Uploaded here, before anything installs the package — not last, where
      # it used to be. A hang during install used to cost the artifact too: a
      # step with nothing to do with building lost the thing that was already
      # built and already proven to be the right architecture.
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 7

      # ── Everything from here on installs the package. That happens inside a
      # privileged container with its own network namespace, never on the
      # runner — see the job-level comment for why. Docker is preinstalled on
      # both runner flavours and ubuntu:24.04 is multi-arch, so the same
      # recipe works unmodified on ubuntu-24.04-arm.
      - name: Start a systemd container
        run: |
          docker run -d --name easywall-test \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${{ github.workspace }}/dist:/dist:ro" \
            ubuntu:24.04 \
            bash -c "apt-get -o Acquire::ForceIPv4=true update && apt-get -o Acquire::ForceIPv4=true install -y systemd systemd-sysv curl python3 && exec /sbin/init"

      # See the job-level comment: postinst only starts the services once
      # /run/systemd/system exists, which only happens once systemd is truly
      # PID 1 and running — not once the container is merely "up". Installing
      # the package before this is confirmed would silently skip the coverage
      # this job exists for.
      # This wait covers three things, not one: pulling ubuntu:24.04 on a cold
      # runner, the container's own `apt-get install systemd` — it cannot exec
      # what it has not installed yet — and only then systemd reaching PID 1.
      # It allowed sixty seconds for all three and stopped fitting: every poll
      # read `systemctl: executable file not found`, which does not mean
      # "systemd never came up" but "apt had not got to it yet", and the loop
      # could not tell those apart. So both are named, the budget covers the
      # install, and a container that has already exited is not waited out for
      # three minutes to be told what its logs said immediately.
      # Two faults, found one at a time on 2026-09-11, and each hid the other.
      #
      # IPv6 to the archive blackholes on the amd64 runners, so `apt-get update
      # -qq` waited out its own timeout and printed nothing — `docker logs` was
      # empty after six minutes, which for `apt-get install -y` is impossible
      # unless update never returned. ForceIPv4 above fixes that half, and -qq
      # is gone so the next stall says where it stopped.
      #
      # With the downloads flowing, the install still did not finish inside 360
      # seconds: the last poll read `offline` — systemctl unpacked, /sbin/init
      # not yet reached — while the container was visibly still unpacking. So
      # the budget is too small as well. arm64 does the same work in 1m47s;
      # this is the amd64 flavour being slow, not the recipe being wrong.
      #
      # 900 is a ceiling, not a cost. The loop breaks the moment systemd
      # answers, so a healthy run pays nothing for the headroom — while a
      # budget shorter than the install reads exactly like a broken package,
      # and sends the next person bisecting something that was never broken.
      - name: Assert systemd is actually running before installing anything
        run: |
          set -euo pipefail
          state=""
          for i in $(seq 1 900); do
            if [ "$(docker inspect -f '{{.State.Running}}' easywall-test 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::the container exited before systemd came up — the install inside it failed"
              docker logs easywall-test --tail 100 || true
              exit 1
            fi
            state=$(docker exec easywall-test systemctl is-system-running 2>/dev/null || true)
            case "$state" in
              running|degraded) echo "systemd state: $state"; break ;;
              ''|*'exec failed'*|*'not found'*)
                echo "waiting (${i}s): systemd is not installed in the container yet" ;;
              *) echo "systemd state: $state" ;;
            esac
            sleep 1
          done
          case "$state" in
            running|degraded) echo "ok  systemd is $state inside the container" ;;
            *)
              echo "::error::systemd never came up in the container (last state: '${state:-none}') — installing the package now would prove nothing"
              docker logs easywall-test --tail 100 || true
              exit 1
              ;;
          esac

      # Building the package proved it compiles. It never proved it installs —
      # and it did not: postinst left /etc/easywall unreadable by the user the
      # web service runs as, so a freshly installed package had no web
      # interface at all. That shipped because nothing here went past the
      # build. apt-get, not dpkg -i, so the runtime dependencies in
      # debian/control get pulled in inside the container, same as a real user
      # installing the package would.
      - name: Install the package
        run: docker exec easywall-test bash -c "apt-get update -qq && apt-get install -y /dist/*.deb"

      - name: Check the installed layout
        run: |
          docker exec -i easywall-test bash -s <<'EOF'
          set -euo pipefail
          fail=0
          # Plain stat, no sudo: docker exec is root by default inside the
          # container, which is exactly the access the runner-side version of
          # this check needed sudo for. /etc/easywall is still 0750
          # root:easywall — that arrangement is what is under test, not worked
          # around.
          check() { # path expected_owner expected_mode
            actual=$(stat -c '%U:%G %a' "$1")
            if [ "$actual" != "$2 $3" ]; then
              echo "::error::$1 is '$actual', expected '$2 $3'"
              fail=1
            else
              echo "ok  $1  $actual"
            fi
          }
          # The two binaries first, because the package shipped without them for
          # its whole existence: they were built into debian/easywall and dh_prep
          # emptied that directory before the .deb was assembled. Every check
          # here is on an installed path, so a package that delivers no
          # executable says so by name rather than as a systemd exit code.
          check /usr/sbin/easywall-core  root:root         755
          check /usr/sbin/easywall-web   root:root         755
          check /etc/easywall            root:easywall     750
          check /etc/easywall/web.toml   easywall:easywall 600
          check /etc/easywall/easywall.toml root:root      600
          check /etc/easywall/ssl        easywall:easywall 750
          # The core's: owned by root, so the core needs no CAP_DAC_OVERRIDE,
          # and not group-writable, so the web user cannot replace what root
          # reads there. The web keeps its state in its own web/ (2.22).
          check /var/lib/easywall        root:easywall     750
          check /var/lib/easywall/web    easywall:easywall 700
          # The three units, by installed path. A unit file that nothing
          # installs is a unit that does not exist on the machine, which is the
          # class of mistake that shipped this package with no binaries at all
          # — and easywall-selftest.service is new in 2.17 and is the one place
          # CAP_SYS_ADMIN is granted, so a package missing it boots a core that
          # records "unprovable" for ever.
          check /lib/systemd/system/easywall-core.service     root:root 644
          check /lib/systemd/system/easywall-web.service      root:root 644
          check /lib/systemd/system/easywall-selftest.service root:root 644
          exit $fail
          EOF

      # The package starts both services itself. Everything below asks the
      # installed system what it is doing rather than starting a second copy by
      # hand — which is what the previous version of this step did, so a core
      # daemon that never came up would not have been noticed.
      - name: Check both services are running
        run: |
          docker exec -i easywall-test bash -s <<'EOF'
          set -euo pipefail
          for unit in easywall-core easywall-web; do
            for i in $(seq 1 20); do
              systemctl is-active --quiet $unit && break
              sleep 0.5
            done
            systemctl is-active --quiet $unit || {
              echo "::error::$unit is not running"
              systemctl status $unit --no-pager -l || true
              journalctl -u $unit --no-pager -n 50 || true
              exit 1
            }
            echo "ok  $unit is active"
          done
          EOF

      # easywall-selftest.service is Type=oneshot with Before=easywall-core, so
      # it is never "active" — is-active reports the wrong thing about it. What
      # has to hold is that postinst enabled it, because an installed-but-
      # disabled unit is a proof that never runs, and that is precisely the
      # silence this release exists to remove.
      #
      # Its result is deliberately not asserted. The container has no
      # CAP_SYS_ADMIN, so the proof records "unprovable" here, and
      # SuccessExitStatus=0 1 2 means that is a success as far as ordering is
      # concerned — the core came up regardless, which the step above just
      # checked. What CI proves about the four claims is proven in test.yml's
      # integration job, under sudo, with EASYWALL_REQUIRE_SELFTEST set.
      - name: The self-test unit is installed and enabled
        run: |
          docker exec -i easywall-test bash -s <<'EOF'
          set -euo pipefail
          state=$(systemctl is-enabled easywall-selftest.service || true)
          [ "$state" = "enabled" ] || {
            echo "::error::easywall-selftest.service is '$state', not enabled — the proof would never run on a packaged installation"
            exit 1
          }
          echo "ok  easywall-selftest.service is enabled"
          # The unit file says AmbientCapabilities=CAP_NET_ADMIN CAP_SYS_ADMIN;
          # systemctl show prints the *lowercase* kernel spelling back —
          # "AmbientCapabilities=cap_net_admin cap_sys_admin". The case is
          # load-bearing: this grep asked for CAP_SYS_ADMIN and so failed on a
          # correctly-built package for the whole of 2.17's first CI run, while
          # the implementer's own report quoted the lowercase form a few lines
          # from the uppercase needle. Match the spelling systemctl emits, and
          # not with -i: a guard that passes because it stopped looking closely
          # is the defect this release is named after.
          systemctl show -p AmbientCapabilities easywall-selftest.service
          systemctl show -p AmbientCapabilities easywall-selftest.service |
            grep -q 'AmbientCapabilities=.*cap_sys_admin' || {
            echo "::error::easywall-selftest.service holds no CAP_SYS_ADMIN, so CLONE_NEWNET will always fail and the self-test can only ever report 'unprovable'"
            exit 1
          }
          echo "ok  easywall-selftest.service holds CAP_SYS_ADMIN"
          EOF

      # The regression that made a fresh install useless: the unit reduces the
      # daemon's capabilities to CAP_NET_ADMIN, which also removes CAP_CHOWN, so
      # the socket stayed root:root and the web user was refused on connect.
      # Nothing in CI ever ran the core, so nothing caught it.
      - name: Check the web user can reach the core
        run: |
          set -euo pipefail
          docker exec easywall-test ls -l /run/easywall/core.sock
          owner=$(docker exec easywall-test stat -c '%U:%G' /run/easywall/core.sock)
          [ "$owner" = "root:easywall" ] || {
            echo "::error::the control socket is $owner, not root:easywall — easywall-web cannot connect"
            exit 1
          }
          # --user drops to the easywall user for the connection itself, the
          # same drop `sudo -u easywall` made when this ran directly on the
          # runner — the design says that user, not root, is what may reach
          # the socket, so that is who has to be the one asking.
          docker exec -i --user easywall easywall-test python3 - <<'PY'
          import json, socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(5)
          try:
              s.connect("/run/easywall/core.sock")
          except OSError as e:
              print(f"::error::the web user cannot connect to the core socket: {e}")
              sys.exit(1)
          s.sendall(json.dumps({"type": "GET_RULES"}).encode())
          s.shutdown(socket.SHUT_WR)
          reply = json.loads(s.recv(65536))
          if not reply.get("success"):
              print(f"::error::the core refused a plain GET_RULES: {reply}")
              sys.exit(1)
          print("the core answered the web user:", str(reply)[:80])
          PY
          docker exec easywall-test test -s /var/lib/easywall/rules.json || {
            echo "::error::the core never wrote its rule store — it cannot reach /var/lib/easywall"
            exit 1
          }

      - name: Check the interface answers and the core config stays out of reach
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            docker exec easywall-test curl -sk -o /dev/null https://127.0.0.1:12227/firstrun && break
            sleep 0.5
          done
          code=$(docker exec easywall-test curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:12227/firstrun)
          echo "GET /firstrun -> $code"
          [ "$code" = "200" ] || { echo "::error::the web interface did not come up"; exit 1; }
          # ssl/ is 0750 easywall:easywall, so only the web user and root can
          # see the certificate it generates — which is the point of it.
          docker exec easywall-test test -s /etc/easywall/ssl/cert.pem || { echo "::error::no certificate was generated"; exit 1; }
          # 2.22: /firstrun refuses a claim without the setup token, so the
          # token has to be where first-run.md and postinst send the operator.
          # journal is captured, not piped straight into grep -q: under
          # set -o pipefail (this step's shell), grep's early exit on the
          # first match can SIGPIPE journalctl before it finishes writing,
          # failing a step whose journal holds the line.
          journal=$(docker exec easywall-test journalctl -u easywall-web --no-pager || true)
          case "$journal" in
            *'setup token'*) ;;
            *) echo "::error::no 'setup token' line in the easywall-web journal — nobody can complete /firstrun"; exit 1 ;;
          esac
          if docker exec --user easywall easywall-test sh -c 'echo x >> /etc/easywall/easywall.toml' 2>/dev/null; then
            echo "::error::the web user can write the core's configuration"
            exit 1
          fi
          echo "the core configuration is out of the web user's reach"

      # ── An upgrade from the shared data directory ─────────────────────────
      #
      # Until 2.22 /var/lib/easywall was 0770 and shared with the web user, who
      # could replace the core's files there and plant links that root wrote
      # through. postinst now makes it root's (0750), gives the web process its
      # own web/ (0700) and takes apart what the old mode allowed. This puts the
      # 2.21 layout back on the installed package, does what that layout let the
      # web user do — as that user — and runs postinst the way dpkg does on an
      # upgrade. The fresh-install check above cannot see any of the repair
      # branches, nor that none of them follows a link.
      - name: An upgrade takes the shared data directory apart safely
        run: |
          docker exec -i easywall-test bash -s <<'EOF'
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          d=/var/lib/easywall
          systemctl stop easywall-web.service easywall-core.service
          # The 2.21 layout: one directory, 0770, shared, no web/.
          rm -rf "$d/web"
          chmod 0770 "$d"
          # What it let the web user do, done as that user: keep its state here,
          # replace a file of the core's, point last_apply at a file root would
          # then write, make web/ a link to /etc, and engage panic mode.
          runuser -u easywall -- sh -c '
            d=/var/lib/easywall
            printf "{\"step\":42}" > "$d/totp_replay.json"
            printf "{}" > "$d/.x" && mv -f "$d/.x" "$d/usage.json"
            ln -sf /etc/shadow "$d/last_apply"
            ln -s /etc "$d/web"
            : > "$d/panic"
            chmod 0666 "$d/usage.json"
            ln "$d/usage.json" "$d/telemetry.json"
            mkfifo "$d/selftest.json"'

          /var/lib/dpkg/info/easywall.postinst configure 2.21.1

          [ "$(stat -c '%U:%G %a' "$d")" = "root:easywall 750" ] || fail "$d is $(stat -c '%U:%G %a' "$d") after the upgrade, want root:easywall 750"
          if [ -L "$d/web" ] || [ ! -d "$d/web" ]; then fail "$d/web is not a real directory"; fi
          [ "$(stat -c '%U:%G %a' "$d/web")" = "easywall:easywall 700" ] || fail "$d/web is $(stat -c '%U:%G %a' "$d/web"), want easywall:easywall 700"
          [ "$(stat -c '%U:%G' /etc)" = "root:root" ] || fail "/etc is $(stat -c '%U:%G' /etc): postinst followed web -> /etc"
          [ ! -L "$d/last_apply" ] || fail "the planted last_apply link survived the upgrade"
          [ "$(stat -c %U "$d/usage.json")" = root ] || fail "usage.json still belongs to the web user, who can go on writing it in place"
          [ "$(stat -c '%U %a %h' "$d/usage.json")" = "root 600 1" ] || fail "usage.json keeps the web user's inode"
          [ ! -p "$d/selftest.json" ] || fail "a FIFO the web user made survived"
          ! runuser -u easywall -- sh -c "echo x >> $d/web/telemetry.json && grep -q x $d/usage.json" || fail "web/telemetry.json still writes usage.json"
          grep -q '"step":42' "$d/web/totp_replay.json" || fail "the TOTP replay step did not move into $d/web"
          [ ! -e "$d/panic" ] || fail "a panic marker the web user made survived the upgrade: the core would leave the firewall down"
          if runuser -u easywall -- ln -s /etc/shadow "$d/planted" 2>/dev/null; then fail "the web user can still plant a link in $d"; fi
          runuser -u easywall -- test -w "$d/web" || fail "the web user cannot write its own $d/web"
          echo "ok  the upgrade made $d root's, gave the web its own web/, and followed no link"

          # Idempotent: a second configure finds nothing to do and says nothing about it.
          again=$(/var/lib/dpkg/info/easywall.postinst configure 2.22.0 2>&1)
          case "$again" in *"easywall: $d"*) fail "a second configure still found something to repair: $again" ;; esac
          echo "ok  a second configure changed nothing"

          for unit in easywall-core easywall-web; do
            for _ in $(seq 1 20); do systemctl is-active --quiet $unit && break; sleep 0.5; done
            systemctl is-active --quiet $unit || fail "$unit did not come back after the upgrade"
          done
          echo "ok  both services are running again"
          EOF

      # The version reaches the binary. It is written in with -ldflags -X, which
      # does nothing at all when the target is a constant — as it was, so every
      # released binary reported the literal in the source instead of its tag.
      # dpkg-parsechangelog reads debian/changelog from the checkout, so that
      # half stays on the runner; only the installed binary is asked inside the
      # container.
      - name: Check the version was compiled in
        run: |
          set -euo pipefail
          want=$(dpkg-parsechangelog --show-field Version)
          for bin in easywall-core easywall-web; do
            got=$(docker exec easywall-test /usr/sbin/$bin --version | awk '{print $2}')
            echo "$bin --version -> $got (package $want)"
            [ "$got" = "$want" ] || {
              echo "::error::$bin reports $got but the package is $want — the -ldflags version injection is not landing"
              exit 1
            }
          done

      - name: Stop the container
        if: always()
        run: docker rm -f easywall-test || true
