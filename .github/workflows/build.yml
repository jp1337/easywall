name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  # ── Cross-compile both binaries for all target platforms ─────────────────
  build-binaries:
    name: Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build easywall-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-core-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-core

      - name: Build easywall-web
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w -X github.com/jp1337/easywall/internal/shared.CurrentVersion=dev" \
            -o bin/easywall-web-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/easywall-web

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  # ── Validate Docker image builds successfully (no push) ───────────────────
  build-docker:
    name: Docker Image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: VERSION=dev
          tags: easywall:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Validate Debian package can be built ─────────────────────────────────
  build-deb:
    name: Debian Package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y devscripts debhelper

      - name: Build .deb
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -us -uc -b -d

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: ../*.deb
          retention-days: 7
