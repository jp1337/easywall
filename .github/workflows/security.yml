name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # setup-go comes *before* codeql-action/init, and the order is
      # load-bearing. init puts a wrapper `go` on PATH so it can trace the
      # build; a setup-go that runs afterwards prepends the real toolchain and
      # the wrapper is never called. CodeQL says so itself on every run, and
      # said so on this repository:
      #
      #   Go was installed after the `codeql-action/init` Action was run.
      #   Expected `which go` to return
      #   /home/runner/work/_temp/codeql-action-go-tracing/bin/go, but got
      #   /opt/hostedtoolcache/go/1.25.12/x64/bin/go
      #
      # It is a warning rather than a failure, so the job stayed green while the
      # analysis was not seeing the build it was pointed at — which is the worst
      # shape a security check can have.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      - run: go build ./...

      - uses: github/codeql-action/analyze@v4

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # -tests is what makes -tags do anything here. Everything behind the
      # integration tag is a _test.go file, and gosec skips test files unless
      # asked, so `-tags integration` on its own scans exactly the same 41 files
      # as no flags at all — measured: 41 files / 9,808 lines / 23 issues, both
      # ways. With -tests it is 148 files and 36,865 lines, and the integration
      # harness — which shells out to ip, nsenter and ping — is finally in scope.
      #
      # The cost is visible: the SARIF goes from 23 findings to 145, and 99 of
      # the additions are file-permission and file-inclusion warnings about
      # tests writing into t.TempDir(). If that buries the ones that matter,
      # the answer is a rule filter, not dropping the tag again.
      - name: Run gosec
        run: gosec -tests -tags integration -fmt sarif -out gosec-results.sarif ./... || true

      # Test files are scanned and their findings are not raised as alerts.
      #
      # Two rounds of measuring produced this. The first filter dropped G301–G307
      # in test files — 47 of the 48 findings, all about writing into t.TempDir(),
      # a directory the kernel deletes when the test ends. What was left was 17
      # more, and reading every one of them:
      #
      #   G204/G702  the integration harness runs ip, nsenter and ping — that is
      #              the harness, and the arguments are its own literals
      #   G104       an unchecked Close() in a helper
      #   G101       the argon2 hash a config-merge fixture is built around
      #   G402/G112  InsecureSkipVerify and a missing ReadHeaderTimeout in the
      #              test server that exists to exercise a self-signed certificate
      #   G124/G115  a cookie built by hand to test the lifetime, a port cast
      #
      # None of them is actionable, and a check that is red for reasons everyone
      # has agreed are not defects teaches people to stop reading it — which is
      # the failure this release is otherwise full of. So: the tag still makes
      # gosec compile and scan the integration code, the counts are printed here,
      # and only what ships raises an alert. If test findings ever need to be
      # acted on, the number in this log is where that starts.
      - name: Keep test-file findings out of the alert list
        run: |
          set -euo pipefail
          echo "in test files, by rule:"
          jq -r '[.runs[].results[]
                  | select((.locations[0].physicalLocation.artifactLocation.uri // "") | test("_test\\.go$"))
                  | .ruleId] | group_by(.)[] | "  \(length)  \(.[0])"' gosec-results.sarif
          before=$(jq '[.runs[].results[]] | length' gosec-results.sarif)
          jq '.runs[].results |= map(select(
                (.locations[0].physicalLocation.artifactLocation.uri // "") | test("_test\\.go$") | not
              ))' gosec-results.sarif > filtered.sarif
          mv filtered.sarif gosec-results.sarif
          echo "$before findings -> $(jq '[.runs[].results[]] | length' gosec-results.sarif) after dropping test files"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
