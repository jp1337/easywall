name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        go: ["1.25"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        continue-on-error: true  # Dependabot PRs lack CODECOV_TOKEN; don't block CI
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

  test-integration:
    name: Integration tests (nftables / CAP_NET_ADMIN)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install nftables
        run: sudo apt-get install -y nftables

      # Integration tests run in an isolated network namespace created by
      # TestMain via CLONE_NEWNET (requires CAP_SYS_ADMIN = root via sudo).
      # They verify that actual nftables rules are applied correctly to the
      # kernel — something unit-test mocking cannot achieve.
      - name: Integration tests (kernel nftables)
        run: sudo go test -tags integration -v -count=1 -timeout 120s ./internal/core/...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout 5m
