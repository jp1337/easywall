name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      # The toolchain comes from go.mod's `toolchain` line, here and in every
      # other job. It used to be written out as "1.25" in ten places while the
      # Dockerfile said 1.26 — so the image was built by a Go version nothing
      # tested with, and no tool could see the disagreement.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      # The profile has to exist and have something in it before anyone is told
      # about it. This check fails; the upload below does not, and that pairing
      # is how an upload that never landed stayed invisible.
      - name: The coverage profile is not empty
        run: |
          set -euo pipefail
          test -s coverage.out || { echo "::error::coverage.out is missing or empty"; exit 1; }
          echo "$(( $(wc -l < coverage.out) - 1 )) covered blocks recorded"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true  # Dependabot PRs lack CODECOV_TOKEN; don't block CI
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: true

  test-integration:
    name: Integration tests (nftables / CAP_NET_ADMIN)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install nftables
        run: sudo apt-get install -y nftables

      # Integration tests run in an isolated network namespace created by
      # TestMain via CLONE_NEWNET (requires CAP_SYS_ADMIN = root via sudo).
      # They verify that actual nftables rules are applied correctly to the
      # kernel — something unit-test mocking cannot achieve.
      - name: Integration tests (kernel nftables)
        run: sudo go test -tags integration -v -count=1 -timeout 120s -coverprofile=coverage-integration.out -covermode=atomic ./internal/core/...

      # Counted, not just run. Without this the rule builders in nftables.go
      # measured 0% — every one of them is exercised here and nowhere else, so
      # the coverage report said the firewall's core logic was untested while
      # the suite above was testing it against a real kernel. A number that
      # wrong is worse than no number: it hid which parts genuinely had none.
      # The suite runs under sudo, so the profile belongs to root and inherits
      # root's umask. The uploader runs as the runner user; a profile it cannot
      # read is an upload that does not happen, behind a step that cannot fail.
      # Codecov's flag list for this repository is empty, which is what "the
      # integration half has never arrived" looks like from outside — this is
      # the cheapest of the candidate causes and the only one reachable from
      # here. Whether it is *the* cause is not something this repository can
      # prove; the check below at least stops the file itself being the problem.
      - name: The integration profile is readable and not empty
        run: |
          set -euo pipefail
          sudo chown "$(id -u):$(id -g)" coverage-integration.out
          test -s coverage-integration.out || {
            echo "::error::coverage-integration.out is missing or empty"; exit 1; }
          echo "$(( $(wc -l < coverage-integration.out) - 1 )) covered blocks recorded"

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true # Dependabot PRs lack CODECOV_TOKEN; don't block CI
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.out
          flags: integration
          fail_ci_if_error: true

  # Both stylesheets and every diagram are generated files that are committed, so
  # a release does not need the Node toolchain. Nothing verified they were
  # current: `npm run check:diagrams` was written for exactly this and CONTRIBUTING.md
  # names it as the guard, but no workflow ever called it, and the docs
  # stylesheet had already drifted from its source by the time anyone looked.
  # A generated file with no freshness check is a file that is stale eventually.
  assets:
    name: Generated assets are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Rebuild in place and let git report the difference — the diff names the
      # rule that is missing, which "files differ" would not.
      - name: Stylesheets match their sources
        run: |
          npm run build:css
          npm run build:docs-css
          git diff --exit-code --stat -- web/static/style.css docs/assets/css/style.css

      - name: Diagrams match their .mmd sources
        run: npm run check:diagrams

      # htmx is the third committed artefact and the only one nothing checked.
      # web/static/htmx.min.js is served to every page and is a copy of the
      # dependency pinned in package.json; the two are kept in step by hand, so
      # a version bump — or Dependabot's — updates the lockfile and leaves the
      # served copy on the old release. Nothing errors: the interface simply runs
      # a version of htmx the project no longer claims to ship.
      - name: The served htmx matches the pinned dependency
        run: |
          cp node_modules/htmx.org/dist/htmx.min.js web/static/htmx.min.js
          git diff --exit-code --stat -- web/static/htmx.min.js || {
            echo "::error::web/static/htmx.min.js is not the htmx pinned in package.json."
            echo "Run: cp node_modules/htmx.org/dist/htmx.min.js web/static/htmx.min.js"
            exit 1
          }

  # What a Go test and a stylesheet diff cannot see: the interface running in a
  # browser. The forwarding editor stored a port of "1E+04" as port 1, because
  # parseInt and <input type="number"> disagree about what the field holds — a
  # mistake no assertion on the server side can reach, and one the page reported
  # as "Changes saved.". The same run also catches a console error, a failed
  # request or a sideways scroll on any page, in both themes.
  #
  # Driven against demo mode, so there is no core daemon, no root and no
  # nftables: the config starts with no password and the script completes the
  # first-run wizard itself, which exercises that too.
  ui:
    name: Interface in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # playwright-core ships no browser of its own. Its Chromium is pinned by the
      # playwright-core version in package-lock.json, so this is reproducible
      # rather than "whatever Chrome the runner image happens to carry".
      #
      # Not --only-shell: a plain chromium.launch() uses the full build, and with
      # the shell alone the launch fails outright. Verified by asking for a bare
      # launch and reading back which binary answered.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The committed stylesheet is what the pages are styled with; build it so a
      # missing rule shows up here as well as in the assets job.
      - name: Compile CSS
        run: npm run build:css

      - name: Build easywall-web
        run: go build -o bin/easywall-web ./cmd/easywall-web

      - name: Start easywall-web in demo mode
        run: |
          set -euo pipefail
          mkdir -p /tmp/easywall/ssl /tmp/easywall/data
          cat > /tmp/easywall/web.toml <<'EOF'
          bind_addr    = "127.0.0.1:12227"
          ssl_dir      = "/tmp/easywall/ssl"
          data_dir     = "/tmp/easywall/data"
          demo_mode    = true
          update_check = false
          session_key  = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          username     = ""
          password     = ""
          [tls]
          cert = ""
          key  = ""
          EOF
          ./bin/easywall-web -config /tmp/easywall/web.toml > /tmp/easywall/web.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sk -o /dev/null https://127.0.0.1:12227/firstrun && break
            sleep 0.25
          done
          curl -skf -o /dev/null https://127.0.0.1:12227/firstrun || {
            echo "::error::easywall-web did not come up"; cat /tmp/easywall/web.log; exit 1;
          }

      - name: Drive the interface
        env:
          EASYWALL_URL: https://127.0.0.1:12227
        run: npm run check:ui

      - name: The server logged nothing it should not have
        if: always()
        run: |
          cat /tmp/easywall/web.log
          # A panic recovered into a 500 is invisible from the browser's side.
          ! grep -q "panic" /tmp/easywall/web.log

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout 5m
