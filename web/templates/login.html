{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easywall — Login</title>
  <script nonce="{{.Nonce}}">(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="/static/icon.svg" alt="easywall" width="48" height="48">
        <span class="auth-logo-name">easywall</span>
      </div>
      <p class="auth-subtitle">{{T "login_title"}}</p>
    </div>

    <div class="auth-body">
      {{if .Flash}}
      <div class="alert {{flashClass .Flash}}" data-auto-dismiss>
        {{flashIcon .Flash}}
        <span>{{T .Flash}}</span>
      </div>
      {{end}}

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="username">{{T "login_username"}}</label>
          <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label for="password">{{T "login_password"}}</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M19 10a.75.75 0 00-.75-.75H8.704l1.048-1.073a.75.75 0 10-1.004-1.114l-2.5 2.5a.75.75 0 000 1.114l2.5 2.5a.75.75 0 101.004-1.114L8.704 10.75H18.25A.75.75 0 0019 10z" clip-rule="evenodd"/></svg>
          {{T "login_submit"}}
        </button>
      </form>
    </div>

    <div class="auth-footer">easywall v2 · Linux firewall management</div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
