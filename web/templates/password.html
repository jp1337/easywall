{{define "password.html"}}
{{template "head" .}}
{{template "sidebar" .}}
<div class="main">
  {{template "topbar" .}}
  <div class="content content-settings">
    {{template "flash" .}}

    <div class="page-header">
      <h1 class="page-title">{{T "password_title"}}</h1>
    </div>

    <div class="card max-w-md">
      <div class="card-pad">
        <h2 class="text-sm font-medium uppercase tracking-wider text-ink-muted flex items-center gap-2">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg>
          Change Password
        </h2>

        <form method="POST" action="/password" class="flex flex-col gap-3 mt-2">
          <fieldset class="fieldset">
            <legend>{{T "password_current"}}</legend>
            <input type="password" id="current_password" name="current_password"
                   autocomplete="current-password" required
                   class="input w-full">
          </fieldset>

          <fieldset class="fieldset">
            <legend>{{T "password_new"}}</legend>
            <input type="password" id="new_password" name="new_password"
                   autocomplete="new-password" minlength="12" required
                   class="input w-full">
            <p class="field-help">Min. 12 characters</p>
          </fieldset>

          <fieldset class="fieldset">
            <legend>{{T "password_confirm"}}</legend>
            <input type="password" id="confirm_password" name="confirm_password"
                   autocomplete="new-password" minlength="12" required
                   class="input w-full">
          </fieldset>

          <div class="flex justify-end pt-2">
            <button type="submit" class="btn btn-primary">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              {{T "password_submit"}}
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{{template "foot" .}}
{{end}}
