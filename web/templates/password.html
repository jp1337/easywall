{{define "password.html"}}
{{template "head" .}}
{{template "sidebar" .}}
<div class="main">
  {{template "topbar" .}}
  <div class="content">
    {{template "flash" .}}

    <div class="page-header">
      <h1 class="page-title">{{T "password_title"}}</h1>
    </div>

    <div class="card" style="max-width:480px">
      <div class="card-body">
        <form method="POST" action="/password">
          <div class="form-group">
            <label for="current_password">{{T "password_current"}}</label>
            <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
          </div>
          <div class="form-group">
            <label for="new_password">{{T "password_new"}}</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="12" required>
          </div>
          <div class="form-group">
            <label for="confirm_password">{{T "password_confirm"}}</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>
          </div>
          <button type="submit" class="btn btn-primary">{{T "password_submit"}}</button>
        </form>
      </div>
    </div>

  </div>
</div>
{{template "foot" .}}
{{end}}
