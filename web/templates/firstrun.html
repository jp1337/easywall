{{define "firstrun.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easywall — First Run Setup</title>
  <script nonce="{{.Nonce}}">(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')t='easywall-'+t;if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'easywall-dark':'easywall-light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preload" href="/static/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{.Asset}}">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <span class="auth-logo-mark" aria-hidden="true"></span>
        <span class="auth-logo-name">easywall</span>
      </div>
      <p class="auth-subtitle">{{T "firstrun_subtitle"}}</p>
    </div>

    <div class="auth-body">
      {{if .Flash}}
      <div role="alert" class="alert {{flashClass .Flash}} mb-4">
        {{flashIcon .Flash}}
        <span>{{T .Flash}}</span>
      </div>
      {{end}}

      <div role="alert" class="alert mb-4">
        <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd"/></svg>
        <span>Welcome! Set up your administrator account to get started.</span>
      </div>

      <form method="POST" action="/firstrun" class="flex flex-col gap-3">
        <div class="field">
          <label class="field-label" for="username">{{T "firstrun_username"}}</label>
          <input id="username" name="username" type="text" autocomplete="username" autofocus required
                 class="input w-full">
        </div>

        <div class="field">
          <label class="field-label" for="password">{{T "firstrun_password"}}</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12"
                 class="input w-full">
          <p class="field-help">Minimum 12 characters</p>
        </div>

        <div class="field">
          <label class="field-label" for="password_confirm">{{T "firstrun_confirm"}}</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="12"
                 class="input w-full">
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2">
          <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/></svg>
          {{T "firstrun_submit"}}
        </button>
      </form>
    </div>

    <div class="auth-footer">easywall v2 · Linux firewall management</div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
