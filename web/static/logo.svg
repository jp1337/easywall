<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 72">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#0f2d4a"/>
      <stop offset="48%"  stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="fc">
      <!-- Flame scaled to fit 72×72 icon area, centered at x=36 -->
      <path d="M36,6 C41.25,10.5 57,22.5 59.25,37.5
               C61.5,48 57.75,57 51,61.5
               C46.5,64.5 42,66 36,66
               C30,66 25.5,64.5 21,61.5
               C14.25,57 10.5,48 12.75,37.5
               C15,22.5 30.75,10.5 36,6Z"/>
    </clipPath>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="0" width="72" height="72" rx="15" fill="#0d1117"/>

  <!-- Flame brick fill -->
  <g clip-path="url(#fc)">
    <rect x="0" y="0" width="72" height="72" fill="url(#g)"/>

    <!-- Horizontal mortar -->
    <rect x="0" y="22.5" width="72" height="2"   fill="#0d1117" opacity="0.6"/>
    <rect x="0" y="37"   width="72" height="2"   fill="#0d1117" opacity="0.6"/>
    <rect x="0" y="51.5" width="72" height="2"   fill="#0d1117" opacity="0.6"/>

    <!-- Vertical: odd rows -->
    <rect x="26"  y="6"    width="1.5" height="16.5" fill="#0d1117" opacity="0.6"/>
    <rect x="46"  y="6"    width="1.5" height="16.5" fill="#0d1117" opacity="0.6"/>
    <rect x="26"  y="39"   width="1.5" height="12.5" fill="#0d1117" opacity="0.6"/>
    <rect x="46"  y="39"   width="1.5" height="12.5" fill="#0d1117" opacity="0.6"/>

    <!-- Vertical: even rows (offset) -->
    <rect x="17"  y="24.5" width="1.5" height="12.5" fill="#0d1117" opacity="0.6"/>
    <rect x="36"  y="24.5" width="1.5" height="12.5" fill="#0d1117" opacity="0.6"/>
    <rect x="55"  y="24.5" width="1.5" height="12.5" fill="#0d1117" opacity="0.6"/>
    <rect x="17"  y="53.5" width="1.5" height="13"   fill="#0d1117" opacity="0.6"/>
    <rect x="36"  y="53.5" width="1.5" height="13"   fill="#0d1117" opacity="0.6"/>
    <rect x="55"  y="53.5" width="1.5" height="13"   fill="#0d1117" opacity="0.6"/>
  </g>

  <!-- Flame outline glow -->
  <path d="M36,6 C41.25,10.5 57,22.5 59.25,37.5
           C61.5,48 57.75,57 51,61.5
           C46.5,64.5 42,66 36,66
           C30,66 25.5,64.5 21,61.5
           C14.25,57 10.5,48 12.75,37.5
           C15,22.5 30.75,10.5 36,6Z"
        fill="none" stroke="#22d3ee" stroke-width="1.2"
        opacity="0.65" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="84" y="46"
        font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="28"
        letter-spacing="-0.8"
        fill="#e6edf3">easywall</text>
</svg>
