<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1e2e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#0f2d4a"/>
      <stop offset="48%"  stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="fc">
      <!-- Flame scaled to ~340×380, centered at x=280, y=315 -->
      <path d="M280,125
               C301,142 362,183 371,245
               C380,294 365,342 338,366
               C322,379 303,387 280,387
               C257,387 238,379 222,366
               C195,342 180,294 189,245
               C198,183 259,142 280,125Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines for depth -->
  <line x1="600" y1="0" x2="600" y2="630" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#161b22" stroke-width="1"/>

  <!-- ── Flame logo (left side) ──────────────────────────── -->
  <g clip-path="url(#fc)">
    <rect x="140" y="100" width="280" height="320" fill="url(#g)"/>

    <!-- Horizontal mortar -->
    <rect x="140" y="197" width="280" height="8" fill="#0d1117" opacity="0.6"/>
    <rect x="140" y="253" width="280" height="8" fill="#0d1117" opacity="0.6"/>
    <rect x="140" y="309" width="280" height="8" fill="#0d1117" opacity="0.6"/>
    <rect x="140" y="365" width="280" height="8" fill="#0d1117" opacity="0.6"/>

    <!-- Vertical: odd rows -->
    <rect x="233" y="125" width="7" height="72" fill="#0d1117" opacity="0.6"/>
    <rect x="327" y="125" width="7" height="72" fill="#0d1117" opacity="0.6"/>
    <rect x="233" y="261" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="327" y="261" width="7" height="48" fill="#0d1117" opacity="0.6"/>

    <!-- Vertical: even rows (offset) -->
    <rect x="186" y="205" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="280" y="205" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="374" y="205" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="186" y="317" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="280" y="317" width="7" height="48" fill="#0d1117" opacity="0.6"/>
    <rect x="374" y="317" width="7" height="48" fill="#0d1117" opacity="0.6"/>
  </g>

  <!-- Flame outline glow -->
  <path d="M280,125
           C301,142 362,183 371,245
           C380,294 365,342 338,366
           C322,379 303,387 280,387
           C257,387 238,379 222,366
           C195,342 180,294 189,245
           C198,183 259,142 280,125Z"
        fill="none" stroke="#22d3ee" stroke-width="3"
        opacity="0.7" filter="url(#glow)"/>

  <!-- ── Text (right side) ──────────────────────────────── -->
  <!-- "easywall" wordmark -->
  <text x="560" y="295"
        font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="100"
        letter-spacing="-3"
        fill="#e6edf3">easywall</text>

  <!-- Tagline -->
  <text x="562" y="360"
        font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="400"
        font-size="28"
        fill="#8b949e">Your firewall. Your rules. No surprises.</text>

  <!-- Tech tags -->
  <rect x="562" y="390" width="56"  height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="578" y="409" font-family="system-ui, sans-serif" font-size="13" fill="#22d3ee" font-weight="600">Go</text>

  <rect x="628" y="390" width="94"  height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="644" y="409" font-family="system-ui, sans-serif" font-size="13" fill="#22d3ee" font-weight="600">nftables</text>

  <rect x="732" y="390" width="104" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="748" y="409" font-family="system-ui, sans-serif" font-size="13" fill="#22d3ee" font-weight="600">GPL-3.0</text>

  <!-- GitHub handle -->
  <text x="562" y="490"
        font-family="system-ui, sans-serif"
        font-size="20"
        fill="#30363d">github.com/jp1337/easywall</text>
</svg>
